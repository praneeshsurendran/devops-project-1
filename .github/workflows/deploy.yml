name: Deploy Infrastructure & App

on:
  push:
    branches:
      - main

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: "ap-southeast-2"
  TF_VAR_public_key: ${{ secrets.TF_VAR_public_key }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./infrastructure
        run: terraform init

      - name: Terraform Apply
        working-directory: ./infrastructure
        run: terraform apply -auto-approve

      - name: Extract Terraform Outputs
        id: tf_outputs
        working-directory: ./infrastructure
        run: |
          echo "server_ip=$(terraform output -raw server_public_ip)" >> $GITHUB_OUTPUT
          echo "server_dns=$(terraform output -raw server_public_dns)" >> $GITHUB_OUTPUT

      - name: Install Ansible & Configure SSH Key
        run: |
          sudo apt-get update && sudo apt-get install -y ansible
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 400 ~/.ssh/deploy_key

      - name: Wait for EC2 SSH to Become Ready
        run: |
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              -o ConnectTimeout=5 \
              -i ~/.ssh/deploy_key \
              ubuntu@${{ steps.tf_outputs.outputs.server_ip }} "echo ready"; then
              exit 0
            fi
            echo "Waiting for SSH on ${{ steps.tf_outputs.outputs.server_ip }}... (attempt $i/30)"
            sleep 5
          done

          echo "::error::EC2 SSH did not become ready after 30 attempts"
          exit 1

      - name: Run Ansible Playbook
        working-directory: ./ansible
        run: |
          echo "[webservers]" > inventory.ini
          echo "${{ steps.tf_outputs.outputs.server_ip }}" >> inventory.ini
          ansible-playbook -i inventory.ini site.yml \
            -u ubuntu \
            --private-key ~/.ssh/deploy_key

      - name: Output Application URL
        run: |
          echo "=========================================================="
          echo "Deployment Complete!"
          echo "Live Application URL: http://${{ steps.tf_outputs.outputs.server_dns }}"
          echo "=========================================================="